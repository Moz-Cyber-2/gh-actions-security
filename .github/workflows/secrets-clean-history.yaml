name: Secrets Clean History (Reusable)

on:
  workflow_call:
    inputs:
      pr_number:
        description: "PR number to clean"
        required: true
        type: string

jobs:
  clean:
    name: Rewrite History
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Verify permission
        id: permission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ACTOR="${{ github.actor }}"

          PERMISSION=$(gh api \
            "repos/${{ github.repository }}/collaborators/${ACTOR}/permission" \
            --jq '.permission')

          echo "User ${ACTOR} has permission: ${PERMISSION}"

          if [[ "$PERMISSION" != "write" && "$PERMISSION" != "admin" && "$PERMISSION" != "maintain" ]]; then
            echo "::error::User ${ACTOR} does not have write permission. Clean aborted."
            exit 1
          fi

          echo "actor=${ACTOR}" >> "$GITHUB_OUTPUT"

      - name: Resolve PR branch
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ inputs.pr_number }}"

          PR_DATA=$(gh pr view "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json headRefName,baseRefName,headRefOid,baseRefOid,state)

          PR_STATE=$(echo "$PR_DATA" | jq -r '.state')
          if [ "$PR_STATE" = "MERGED" ]; then
            echo "::error::PR #${PR_NUMBER} is already merged. Cannot rewrite a merged PR."
            exit 1
          fi

          HEAD_BRANCH=$(echo "$PR_DATA" | jq -r '.headRefName')
          if [[ "$HEAD_BRANCH" == "main" || "$HEAD_BRANCH" == "master" ]]; then
            echo "::error::Rewriting history on '${HEAD_BRANCH}' is not allowed. The clean must be triggered from a feature branch."
            exit 1
          fi

          BASE_SHA=$(echo "$PR_DATA"    | jq -r '.baseRefOid')
          HEAD_SHA=$(echo "$PR_DATA"    | jq -r '.headRefOid')

          echo "pr_number=${PR_NUMBER}"       >> "$GITHUB_OUTPUT"
          echo "head_branch=${HEAD_BRANCH}"   >> "$GITHUB_OUTPUT"
          echo "base_sha=${BASE_SHA}"         >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}"         >> "$GITHUB_OUTPUT"

      - name: Post acknowledgement comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ steps.pr.outputs.pr_number }}" \
            --repo "${{ github.repository }}" \
            --body "History rewrite started by @${{ steps.permission.outputs.actor }}. Force-push incoming — stand by."

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install TruffleHog
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64)        TH_ARCH="amd64" ;;
            aarch64|arm64) TH_ARCH="arm64" ;;
            *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
          esac
          VERSION="3.94.3"
          curl -sSL -o /tmp/trufflehog.tar.gz \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${VERSION}/trufflehog_${VERSION}_Linux_${TH_ARCH}.tar.gz"
          tar -xzf /tmp/trufflehog.tar.gz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/trufflehog"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install git-filter-repo
        run: pip install --quiet git-filter-repo

      - name: Re-scan to collect raw secret values
        id: rescan
        run: |
          set -euo pipefail
          BASE_SHA="${{ steps.pr.outputs.base_sha }}"
          HEAD_SHA="${{ steps.pr.outputs.head_sha }}"

          trufflehog git \
            --since-commit="${BASE_SHA}" \
            --branch="${HEAD_SHA}" \
            --results=verified,unverified \
            --json \
            --no-update \
            "file://." > raw_findings.json 2>/dev/null || true

          FINDINGS=$(wc -l < raw_findings.json | tr -d ' ')
          echo "findings_count=${FINDINGS}" >> "$GITHUB_OUTPUT"
          echo "Findings to rewrite: ${FINDINGS}"

      - name: Rewrite history
        if: steps.rescan.outputs.findings_count != '0'
        run: |
          set -euo pipefail

          # Write replacements to a temp file — raw values never touch disk beyond this ephemeral runner
          REPLACEMENTS_FILE="$(mktemp)"
          trap 'rm -f "$REPLACEMENTS_FILE"' EXIT

          while IFS= read -r line; do
            RAW=$(echo "$line"  | jq -r '.Raw   // empty')
            RAW2=$(echo "$line" | jq -r '.RawV2 // empty')
            for VAL in "$RAW" "$RAW2"; do
              if [ -n "$VAL" ] && [ "${#VAL}" -gt 4 ]; then
                printf '%s==>***REMOVED***\n' "$VAL" >> "$REPLACEMENTS_FILE"
              fi
            done
          done < raw_findings.json

          sort -u "$REPLACEMENTS_FILE" -o "$REPLACEMENTS_FILE"
          ENTRY_COUNT=$(wc -l < "$REPLACEMENTS_FILE" | tr -d ' ')
          echo "Applying ${ENTRY_COUNT} replacement(s) with git filter-repo..."

          git filter-repo \
            --replace-text "$REPLACEMENTS_FILE" \
            --force

          echo "replaced_count=${ENTRY_COUNT}" >> "$GITHUB_ENV"

      - name: Force-push cleaned branch
        if: steps.rescan.outputs.findings_count != '0'
        run: |
          # git filter-repo removes the 'origin' remote — push via explicit URL
          REMOTE_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push "$REMOTE_URL" "${{ steps.pr.outputs.head_branch }}" --force

      - name: Cleanup sensitive files
        if: always()
        run: rm -f raw_findings.json

      - name: Post result comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FINDINGS="${{ steps.rescan.outputs.findings_count }}"
          PR="${{ steps.pr.outputs.pr_number }}"
          BRANCH="${{ steps.pr.outputs.head_branch }}"

          if [ "${FINDINGS:-0}" = "0" ]; then
            BODY="No secrets found on branch \`${BRANCH}\` during re-scan. Nothing to rewrite — the branch may already be clean."
          else
            BODY="## History rewrite complete

          Branch \`${BRANCH}\` has been rewritten: **${replaced_count:-$FINDINGS} replacement(s)** applied with \`git filter-repo\`.

          Secret values have been replaced with \`***REMOVED***\` across all affected commits.

          ### You must now

          1. **Rotate every exposed credential immediately.** Treat them as fully compromised — they may have been cached by GitHub or seen by anyone with repo access before the rewrite.
          2. **Update your local clone:**
             \`\`\`bash
             git fetch origin
             git checkout ${BRANCH}
             git reset --hard origin/${BRANCH}
             \`\`\`
          3. Notify your security team if any credential had production access.

          > History rewriting removes the values from git objects but does not guarantee they were not already read or cached externally."
          fi

          gh pr comment "$PR" \
            --repo "${{ github.repository }}" \
            --body "$BODY"

      - name: Remove secrets-detected label
        if: steps.rescan.outputs.findings_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ steps.pr.outputs.pr_number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "secrets-detected" 2>/dev/null || true
