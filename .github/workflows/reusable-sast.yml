name: SAST — Semgrep (Reusable)

on:
  workflow_call:
    inputs:
      config:
        description: "Space-separated Semgrep rule configs (registry IDs or local paths)"
        required: false
        type: string
        default: "p/owasp-top-ten p/nodejs p/secrets"
      fail_on_findings:
        description: "Fail the workflow if Semgrep finds issues"
        required: false
        type: boolean
        default: true
      paths:
        description: "Paths to scan (space-separated, relative to repo root)"
        required: false
        type: string
        default: "."

jobs:
  semgrep:
    name: Semgrep
    runs-on: devsecops-demo
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: |
          set -euo pipefail
          if command -v semgrep &>/dev/null; then
            echo "Semgrep already installed: $(semgrep --version)"
          else
            pip3 install semgrep --quiet
          fi
          semgrep --version

      - name: Run Semgrep — text output (human readable)
        run: |
          CONFIGS=""
          for c in ${{ inputs.config }}; do CONFIGS="$CONFIGS --config $c"; done
          semgrep scan \
            $CONFIGS \
            --error \
            ${{ inputs.paths }} \
            || SEMGREP_EXIT=$?
          echo "SEMGREP_EXIT=${SEMGREP_EXIT:-0}" >> "$GITHUB_ENV"

      - name: Run Semgrep — SARIF output
        if: always()
        run: |
          CONFIGS=""
          for c in ${{ inputs.config }}; do CONFIGS="$CONFIGS --config $c"; done
          semgrep scan \
            $CONFIGS \
            --sarif \
            --output semgrep-results.sarif \
            ${{ inputs.paths }} || true

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep-sast

      - name: Count findings
        id: count
        if: always()
        run: |
          FINDINGS=$(jq '[.runs[].results[]] | length' semgrep-results.sarif 2>/dev/null || echo "0")
          echo "findings=${FINDINGS}" >> "$GITHUB_OUTPUT"
          echo "Semgrep found ${FINDINGS} finding(s)"

      - name: Upload findings to DefectDojo
        if: always()
        env:
          DD_API_TOKEN: ${{ secrets.DD_API_TOKEN }}
          DD_URL: ${{ secrets.DD_URL }}
          DD_ENGAGEMENT_ID: ${{ secrets.DD_ENGAGEMENT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${DD_API_TOKEN:-}" || -z "${DD_URL:-}" ]]; then
            echo "DefectDojo secrets not configured — skipping upload"
            exit 0
          fi
          if [[ ! -f semgrep-results.sarif ]]; then
            echo "No SARIF file found — skipping upload"
            exit 0
          fi
          curl -s -m 120 -o /dev/null -w "%{http_code}" -X POST "${DD_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${DD_API_TOKEN}" \
            -F "scan_type=SARIF" \
            -F "engagement=${DD_ENGAGEMENT_ID}" \
            -F "file=@semgrep-results.sarif" \
            -F "active=true" \
            -F "verified=false" | grep -qE "^2" && echo "DefectDojo upload successful" || echo "DefectDojo upload failed (non-blocking)"

      - name: Post PR comment and label (SAST)
        if: always() && steps.count.outputs.findings != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FINDINGS_COUNT: ${{ steps.count.outputs.findings }}
        run: |
          if [[ -z "$PR_NUMBER" ]]; then
            echo "Not a PR context — skipping comment"
            exit 0
          fi
          REPO="${{ github.repository }}"
          gh label create "security: sast-findings" \
            --color "E4E669" \
            --description "SAST issues detected by Semgrep" \
            --repo "$REPO" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --add-label "security: sast-findings" --repo "$REPO" || true
          python3 - << 'PYEOF'
          import json, os
          count = os.environ["FINDINGS_COUNT"]
          rows = []
          with open("semgrep-results.sarif") as f:
              sarif = json.load(f)
          for run in sarif.get("runs", []):
              for result in run.get("results", []):
                  rule_id = result.get("ruleId", "")
                  level = result.get("level", "warning")
                  for loc in result.get("locations", []):
                      pl = loc.get("physicalLocation", {})
                      uri = pl.get("artifactLocation", {}).get("uri", "")
                      line = pl.get("region", {}).get("startLine", "")
                      rows.append(f"| `{rule_id}` | {level} | `{uri}:{line}` |")
          table = "| Rule | Level | Location |\n|---|---|---|\n" + "\n".join(rows[:20])
          if len(rows) > 20:
              table += f"\n\n_...and {len(rows)-20} more. See Security tab for full list._"
          body = (
              f"## :warning: Semgrep SAST — {count} Finding(s)\n\n"
              f"{table}\n\n"
              f"Review all findings in the **Security tab \u2192 Code scanning alerts**."
          )
          with open("/tmp/sg-comment.md", "w") as f:
              f.write(body)
          PYEOF
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/sg-comment.md
          rm -f /tmp/sg-comment.md

      - name: Fail on findings
        if: inputs.fail_on_findings && env.SEMGREP_EXIT != '0'
        run: |
          echo "::error::Semgrep found ${{ steps.count.outputs.findings }} issue(s)."
          echo "::error::Review findings in the Security tab → Code scanning alerts."
          exit 1
