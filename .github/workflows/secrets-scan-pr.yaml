name: Secrets Scan

on:
  workflow_call:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main
      - master

jobs:
  secrets-scan:
    name: TruffleHog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout gh-actions-security (for custom detector)
        uses: actions/checkout@v4
        with:
          repository: Moz-Cyber-2/gh-actions-security
          ref: main
          path: .gh-actions-security
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install TruffleHog
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64)        TH_ARCH="amd64" ;;
            aarch64|arm64) TH_ARCH="arm64" ;;
            *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
          esac
          VERSION="3.94.3"
          curl -sSL -o /tmp/trufflehog.tar.gz \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${VERSION}/trufflehog_${VERSION}_Linux_${TH_ARCH}.tar.gz"
          tar -xzf /tmp/trufflehog.tar.gz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/trufflehog"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/trufflehog" --version

      - name: Run TruffleHog
        id: scan
        run: |
          set -euo pipefail

          DETECTOR_CONFIG=".gh-actions-security/custom-detectors.yaml"
          PR_BASE="${{ github.event.pull_request.base.sha }}"
          PR_HEAD="${{ github.event.pull_request.head.sha }}"
          PUSH_BEFORE="${{ github.event.before }}"
          PUSH_HEAD="${{ github.sha }}"

          run_scan() {
            local extra_args="$1"
            trufflehog git \
              --config="$DETECTOR_CONFIG" \
              --results=verified,unverified \
              --json \
              --no-update \
              $extra_args \
              "file://." > findings.json 2>/dev/null || true
          }

          if [[ -n "$PR_BASE" ]]; then
            echo "Event: PR — scanning ${PR_BASE}..${PR_HEAD}"
            run_scan "--since-commit=${PR_BASE} --branch=${PR_HEAD}"
          elif [[ -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            echo "Event: push — scanning ${PUSH_BEFORE}..${PUSH_HEAD}"
            run_scan "--since-commit=${PUSH_BEFORE} --branch=${PUSH_HEAD}"
          else
            echo "Event: new branch / workflow_call — scanning HEAD (${PUSH_HEAD})"
            run_scan "--branch=${PUSH_HEAD} --max-depth=1"
          fi

          FINDINGS=$(wc -l < findings.json | tr -d ' ')
          echo "findings_count=${FINDINGS}" >> "$GITHUB_OUTPUT"
          echo "Total findings: ${FINDINGS}"
          if [[ "$FINDINGS" != "0" ]]; then
            echo "--- Findings ---"
            cat findings.json
          fi

      - name: Cleanup
        if: always()
        run: rm -f findings.json

      - name: Fail on findings
        if: steps.scan.outputs.findings_count != '0'
        run: |
          echo "::error::TruffleHog detected ${{ steps.scan.outputs.findings_count }} hardcoded secret(s). Review the scan output above."
          exit 1
