name: Secrets Scan

on:
  workflow_call:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main
      - master

jobs:
  secrets-scan:
    name: TruffleHog
    runs-on: devsecops-demo
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure TruffleHog is available
        run: |
          set -euo pipefail
          if command -v trufflehog &>/dev/null; then
            echo "TruffleHog already available: $(trufflehog --version 2>&1 | head -1)"
          else
            brew install trufflehog
          fi

      - name: Write custom detector config
        run: |
          cat > /tmp/custom-detectors.yaml << 'EOF'
          detectors:
            - name: DemoHardcodedSecret
              keywords:
                - secret-found-placeholder
              regex:
                secret: 'secret-found-placeholder'
          EOF

      - name: Run TruffleHog
        id: scan
        run: |
          set -euo pipefail

          DETECTOR_CONFIG="/tmp/custom-detectors.yaml"
          PR_BASE="${{ github.event.pull_request.base.sha }}"
          PR_HEAD="${{ github.event.pull_request.head.sha }}"
          PUSH_BEFORE="${{ github.event.before }}"
          PUSH_HEAD="${{ github.sha }}"

          run_scan() {
            local extra_args="$1"
            trufflehog git \
              --config="$DETECTOR_CONFIG" \
              --results=verified,unverified \
              --json \
              --no-update \
              $extra_args \
              "file://." > findings.json 2>scan_stderr.txt || true
            if [[ -s scan_stderr.txt ]]; then
              echo "--- TruffleHog stderr ---"
              cat scan_stderr.txt
            fi
          }

          if [[ -n "$PR_BASE" ]]; then
            echo "Event: PR — scanning ${PR_BASE}..${PR_HEAD}"
            run_scan "--since-commit=${PR_BASE} --branch=${PR_HEAD}"
          elif [[ -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            echo "Event: push — scanning ${PUSH_BEFORE}..${PUSH_HEAD}"
            run_scan "--since-commit=${PUSH_BEFORE} --branch=${PUSH_HEAD}"
          else
            echo "Event: new branch / workflow_call — scanning HEAD (${PUSH_HEAD})"
            run_scan "--branch=${PUSH_HEAD} --max-depth=1"
          fi

          FINDINGS=$(wc -l < findings.json | tr -d ' ')
          echo "findings_count=${FINDINGS}" >> "$GITHUB_OUTPUT"
          echo "Total findings: ${FINDINGS}"
          if [[ "$FINDINGS" != "0" ]]; then
            echo "--- Findings ---"
            cat findings.json
          fi

      - name: Upload findings to DefectDojo
        if: always() && steps.scan.outputs.findings_count != '0'
        env:
          DD_API_TOKEN: ${{ secrets.DD_API_TOKEN }}
          DD_URL: ${{ secrets.DD_URL }}
          DD_ENGAGEMENT_ID: ${{ secrets.DD_ENGAGEMENT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${DD_API_TOKEN:-}" || -z "${DD_URL:-}" ]]; then
            echo "DefectDojo secrets not configured — skipping upload"
            exit 0
          fi
          # Convert TruffleHog JSON lines to Generic Findings Import format
          python3 - << 'PYEOF'
          import json, sys
          findings = []
          with open("findings.json") as f:
            for line in f:
              line = line.strip()
              if not line: continue
              d = json.loads(line)
              meta = d.get("SourceMetadata", {}).get("Data", {}).get("Git", {})
              findings.append({
                "title": f"Hardcoded secret: {d.get('DetectorName','CustomRegex')}",
                "severity": "High",
                "description": f"Detector: {d.get('DetectorName')}\nFile: {meta.get('file','')}\nLine: {meta.get('line','')}\nRaw: {d.get('Raw','')}",
                "active": True,
                "verified": False
              })
          out = {"findings": findings}
          with open("/tmp/trufflehog-dd.json", "w") as f:
            json.dump(out, f)
          print(f"Converted {len(findings)} findings")
          PYEOF
          curl -s -m 120 -o /dev/null -w "%{http_code}" -X POST "${DD_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${DD_API_TOKEN}" \
            -F "scan_type=Generic Findings Import" \
            -F "engagement=${DD_ENGAGEMENT_ID}" \
            -F "file=@/tmp/trufflehog-dd.json" \
            -F "active=true" \
            -F "verified=false" | grep -qE "^2" && echo "DefectDojo upload successful" || echo "DefectDojo upload failed (non-blocking)"

      - name: Post PR comment and label (secrets)
        if: steps.scan.outputs.findings_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -z "$PR_NUMBER" ]]; then
            echo "Not a PR context — skipping comment"
            exit 0
          fi
          REPO="${{ github.repository }}"
          gh label create "security: secrets-found" \
            --color "B60205" \
            --description "Hardcoded secrets detected by TruffleHog" \
            --repo "$REPO" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --add-label "security: secrets-found" --repo "$REPO" || true
          python3 - << 'PYEOF' > /tmp/th-table.md
          import json
          rows = []
          with open("findings.json") as f:
              for line in f:
                  line = line.strip()
                  if not line: continue
                  d = json.loads(line)
                  meta = d.get("SourceMetadata", {}).get("Data", {}).get("Git", {})
                  raw = d.get("Raw", "")[:60]
                  rows.append(f"| {d.get('DetectorName','CustomRegex')} | `{meta.get('file','')}` | {meta.get('line','')} | `{raw}` |")
          print("| Detector | File | Line | Raw |")
          print("|---|---|---|---|")
          for row in rows:
              print(row)
          PYEOF
          TABLE=$(cat /tmp/th-table.md)
          COUNT="${{ steps.scan.outputs.findings_count }}"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "## :rotating_light: TruffleHog — ${COUNT} Secret(s) Detected

TruffleHog found **${COUNT}** hardcoded secret(s) in this PR.

${TABLE}

> **Important:** Deleting the file is **not enough**. The secret remains accessible in previous commits and can be recovered from git history.
> You must **clean the git history** using a tool like [\`git filter-repo\`](https://github.com/newren/git-filter-repo) or [BFG Repo Cleaner](https://rtyley.github.io/bfg-repo-cleaner/) to fully remove it."

      - name: Cleanup
        if: always()
        run: rm -f findings.json scan_stderr.txt /tmp/trufflehog-dd.json /tmp/custom-detectors.yaml /tmp/th-table.md

      - name: Fail on findings
        if: steps.scan.outputs.findings_count != '0'
        run: |
          echo "::error::TruffleHog detected ${{ steps.scan.outputs.findings_count }} hardcoded secret(s). Review the scan output above."
          exit 1
