name: Secrets Scan 

on:
  workflow_call:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main
      - master

jobs:
  secrets-scan:
    name: TruffleHog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For pull_request_target: check out the PR head SHA (not the base branch default).
          # For push: check out the pushed commit SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install TruffleHog
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64)        TH_ARCH="amd64" ;;
            aarch64|arm64) TH_ARCH="arm64" ;;
            *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
          esac
          VERSION="3.94.3"
          curl -sSL -o /tmp/trufflehog.tar.gz \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${VERSION}/trufflehog_${VERSION}_Linux_${TH_ARCH}.tar.gz"
          tar -xzf /tmp/trufflehog.tar.gz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/trufflehog"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/trufflehog" --version

      - name: Run TruffleHog
        id: scan
        run: |
          set -euo pipefail

          PR_BASE="${{ github.event.pull_request.base.sha }}"
          PR_HEAD="${{ github.event.pull_request.head.sha }}"
          PUSH_BEFORE="${{ github.event.before }}"
          PUSH_HEAD="${{ github.sha }}"

          if [[ -n "$PR_BASE" ]]; then
            # pull_request_target or workflow_call with PR context
            BASE_SHA="$PR_BASE"
            HEAD_SHA="$PR_HEAD"
            echo "Event: PR — scanning ${BASE_SHA}..${HEAD_SHA}"
            trufflehog git \
              --since-commit="$BASE_SHA" \
              --branch="$HEAD_SHA" \
              --results=verified,unverified \
              --json \
              --no-update \
              "file://." > findings.json 2>/dev/null || true
          elif [[ -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            # Direct push to an existing branch
            BASE_SHA="$PUSH_BEFORE"
            HEAD_SHA="$PUSH_HEAD"
            echo "Event: push — scanning ${BASE_SHA}..${HEAD_SHA}"
            trufflehog git \
              --since-commit="$BASE_SHA" \
              --branch="$HEAD_SHA" \
              --results=verified,unverified \
              --json \
              --no-update \
              "file://." > findings.json 2>/dev/null || true
          else
            # New branch (before SHA is all zeros) or workflow_call without PR context
            HEAD_SHA="$PUSH_HEAD"
            echo "Event: new branch or workflow_call — scanning HEAD commit only (${HEAD_SHA})"
            trufflehog git \
              --branch="$HEAD_SHA" \
              --max-depth=1 \
              --results=verified,unverified \
              --json \
              --no-update \
              "file://." > findings.json 2>/dev/null || true
          fi

          FINDINGS=$(wc -l < findings.json | tr -d ' ')
          echo "findings_count=${FINDINGS}" >> "$GITHUB_OUTPUT"
          echo "Total findings: ${FINDINGS}"

      - name: Cleanup
        if: always()
        run: rm -f findings.json

      - name: Fail on findings
        if: steps.scan.outputs.findings_count != '0'
        run: |
          echo "::error::TruffleHog detected ${{ steps.scan.outputs.findings_count }} secret(s). Review the scan output above for details."
          exit 1
