name: Container Image Scan (Trivy) — Reusable

on:
  workflow_call:
    inputs:
      image_ref:
        description: "Full image reference as it appears in the local Podman store (name:tag)"
        required: true
        type: string
      severity:
        description: "Comma-separated list of severities to scan for"
        required: false
        type: string
        default: "HIGH,CRITICAL"
      fail_on_findings:
        description: "Fail the workflow if vulnerabilities are found"
        required: false
        type: boolean
        default: true

jobs:
  trivy-scan:
    name: Trivy
    runs-on: devsecops-demo
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Install Trivy
        run: |
          set -euo pipefail
          if command -v trivy &>/dev/null; then
            echo "Trivy already installed: $(trivy --version | head -1)"
            exit 0
          fi
          VERSION="0.58.2"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64)        TRV_ARCH="64bit" ;;
            aarch64|arm64) TRV_ARCH="ARM64" ;;
            *) echo "Unsupported arch: $ARCH"; exit 1 ;;
          esac
          curl -sSL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_macOS-${TRV_ARCH}.tar.gz"
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo mv /tmp/trivy /usr/local/bin/trivy
          trivy --version

      - name: Export image to tarball for Trivy
        run: |
          set -euo pipefail
          podman save \
            --format=docker-archive \
            "${{ inputs.image_ref }}" \
            -o /tmp/scan-image.tar

      - name: Run Trivy — table output (human readable)
        run: |
          trivy image \
            --input /tmp/scan-image.tar \
            --severity "${{ inputs.severity }}" \
            --exit-code 0 \
            --no-progress

      - name: Run Trivy — SARIF output (GitHub Security tab)
        run: |
          trivy image \
            --input /tmp/scan-image.tar \
            --severity "${{ inputs.severity }}" \
            --format sarif \
            --output /tmp/trivy-results.sarif \
            --exit-code 0 \
            --no-progress

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: /tmp/trivy-results.sarif
          category: trivy-container

      - name: Upload findings to DefectDojo
        if: always()
        env:
          DD_API_TOKEN: ${{ secrets.DD_API_TOKEN }}
          DD_URL: ${{ secrets.DD_URL }}
          DD_ENGAGEMENT_ID: ${{ secrets.DD_ENGAGEMENT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${DD_API_TOKEN:-}" || -z "${DD_URL:-}" ]]; then
            echo "DefectDojo secrets not configured — skipping upload"
            exit 0
          fi
          if [[ ! -f /tmp/trivy-results.sarif ]]; then
            echo "No SARIF file found — skipping upload"
            exit 0
          fi
          curl -s -m 120 -o /dev/null -w "%{http_code}" -X POST "${DD_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${DD_API_TOKEN}" \
            -F "scan_type=SARIF" \
            -F "engagement=${DD_ENGAGEMENT_ID}" \
            -F "file=@/tmp/trivy-results.sarif" \
            -F "active=true" \
            -F "verified=false" | grep -qE "^2" && echo "DefectDojo upload successful" || echo "DefectDojo upload failed (non-blocking)"

      - name: Count findings and fail
        run: |
          set -euo pipefail
          FINDINGS=$(jq '[.runs[].results[]] | length' /tmp/trivy-results.sarif 2>/dev/null || echo "0")
          echo "Trivy found ${FINDINGS} finding(s) at severity ${{ inputs.severity }}"
          rm -f /tmp/scan-image.tar /tmp/trivy-results.sarif
          if [[ "${{ inputs.fail_on_findings }}" == "true" && "$FINDINGS" != "0" ]]; then
            echo "::error::Trivy found ${FINDINGS} CVE(s) at severity ${{ inputs.severity }}. Review Security tab → Code scanning alerts."
            exit 1
          fi
